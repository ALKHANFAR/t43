<!DOCTYPE html>
<html data-theme="siyadah" data-session="checking" lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيادة — أول موظف لك</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.png">
<link rel="preload" href="../fonts/readex-pro-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/wordmark.png" as="image" crossorigin>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../siyadah-theme.css">
<style>
/* ==========================================================================
   سيادة — الإعداد الأول
   أربع لحظات: موقعك، أولويتك، ثلاثة اقتراحات، وتجهيز موظف واحد.
   الأدوات تُربط لاحقًا وقت الحاجة من داخل المحادثة — ما فيه خطوة ربط هنا.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;z-index:10;inset-block-start:-80px;inset-inline-start:18px;padding:8px 14px;background:var(--ink);color:var(--paper)}
.skip:focus{inset-block-start:12px}
::selection{background:var(--accent);color:#fff}
.logo{display:block;background:currentColor;aspect-ratio:802/99;-webkit-mask:url(../assets/wordmark.png) center/contain no-repeat;mask:url(../assets/wordmark.png) center/contain no-repeat}
.drop{display:inline-block;background:currentColor;color:var(--accent);aspect-ratio:150/84;width:11px;flex:none;-webkit-mask:url(../assets/icon.png) center/contain no-repeat;mask:url(../assets/icon.png) center/contain no-repeat}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,48px)}
.top .logo{width:104px}
.top small{font-family:var(--f-display);font-size:.8rem;color:var(--ash);font-variant-numeric:tabular-nums}
.top__actions{display:flex;align-items:center;gap:14px}
.lang-switch{display:flex;align-items:center;border:1px solid var(--hair);border-radius:var(--radius-control);padding:2px;gap:2px;direction:ltr}
.lang-switch button{border:0;background:transparent;color:var(--ash);font-size:.75rem;line-height:1;padding:7px 8px;border-radius:7px}
.lang-switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.top__logout{border:0;background:transparent;color:var(--ash);font-size:.8rem;padding:8px 0}
.top__logout:hover{color:var(--accent)}
.logout-status{position:absolute;inset-block-start:65px;inset-inline-end:clamp(20px,4vw,48px);margin:0;font-size:.75rem;color:var(--error)}
.prog{height:1.5px;background:var(--hair);margin:0 clamp(20px,4vw,48px)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s var(--ease)}

.wrap{max-width:960px;margin:0 auto;padding:clamp(20px,4vh,44px) 22px calc(132px + env(safe-area-inset-bottom))}
.step[data-step="1"]{max-width:680px;margin-inline:auto}
.step[data-step="2"].on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:22px}
.step[data-step="2"]>.k,.step[data-step="2"]>h1,.step[data-step="2"]>.sub{grid-column:1/-1}
.step[data-step="2"]>.sub{margin-block-end:22px}
.step__review,.step__employee{min-width:0}
.step__employee>.k{margin-block-end:11px}
@media(max-width:760px){.step[data-step="2"].on{display:block}.step__review{margin-block-end:22px}}
.step{display:none;animation:in .45s var(--ease)}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font-family:var(--f-display);font-size:.8rem;color:var(--ash);display:flex;align-items:center;gap:10px;margin-block-end:18px}
h1{font-family:var(--f-display);font-weight:300;font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.01em;line-height:1.25;margin:0 0 12px}
.sub{color:var(--ash);margin:0 0 30px;max-width:52ch;text-wrap:pretty}

.field{margin-block-end:18px}
.field label{display:block;font-family:var(--f-display);font-size:.8rem;color:var(--ash);margin-block-end:8px}
.optional{font-family:var(--f-body);font-size:.75rem;color:var(--ash);margin-inline-start:4px}
.in{width:100%;padding:13px 0;border:0;border-block-end:1px solid var(--field-edge);background:none;font-size:1.05rem;transition:border-color .2s}
.in:focus{outline:none;border-block-end-color:var(--accent)}
.in::placeholder{color:#757575}
textarea.in{resize:vertical;min-height:120px;line-height:1.8;border:1px solid var(--field-edge);padding:14px 16px;font-size:1.02rem}
textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}


/* قراءة الموقع — تصير في الخلفية، العميل يشوف النتيجة فقط */
.site{position:relative;overflow:hidden;border:1px solid var(--hair);padding:14px 16px;margin-block-start:12px;display:flex;align-items:center;gap:12px;font-size:.875rem;color:var(--ash);min-height:52px;transition:border-color .3s ease,background-color .3s ease}
.site.busy .drop{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.2}}
.site.busy::after{content:"";position:absolute;inset-block-end:0;inset-inline-start:0;width:38%;height:2px;background:var(--accent);animation:scan 1.25s var(--ease) infinite}
@keyframes scan{from{transform:translateX(260%)}to{transform:translateX(-360%)}}
.site.ok{border-color:var(--accent-edge);background:var(--accent-wash);color:var(--ink)}
.site b{font-weight:500}
.site small{display:block;color:var(--ash);font-size:.8rem}
.kb{border:1px solid var(--hair);margin-block-end:18px}
.kb__h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-block-end:1px solid var(--hair);background:var(--wash);font-family:var(--f-display);font-size:.8rem;color:var(--ash)}
.kb__h b{font-weight:400;color:var(--ink);font-size:.95rem}
.kb__body{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:13px 16px;align-items:center}
.kb__body--plain{display:block}
.coverage{--coverage:0;position:relative;width:66px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--coverage)*1%),var(--hair) 0)}
.coverage::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper)}
.coverage strong{position:relative;z-index:1;font-family:var(--f-display);font-size:1.25rem;font-weight:300;font-variant-numeric:tabular-nums}
.kb__summary{margin:0;color:var(--ink);font-size:.95rem;line-height:1.75}
.kb__meta{display:flex;flex-wrap:wrap;gap:8px;margin-block-start:12px}
.kb__meta span{font-size:.75rem;color:var(--ash);border:1px solid var(--hair);padding:3px 8px}
.kb__g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair)}
.kb__g div{background:var(--paper);padding:8px 16px}
.kb__v{font-family:var(--f-display);font-weight:300;font-size:1.35rem;line-height:1}
.kb__l{font-size:.8rem;color:var(--ash);margin-block-start:5px}
.kb__f{padding:8px 16px;font-size:.8rem;color:var(--ash);border-block-start:1px solid var(--hair);display:flex;align-items:center;gap:8px}
.kb__f b{color:var(--ink);font-weight:500}
@media (max-width:600px){.kb__body{grid-template-columns:1fr}.coverage{width:76px}.kb__g{grid-template-columns:repeat(3,1fr)}.kb__g div{padding:10px}.kb__v{font-size:1.1rem}}

/* بدون موقع — بدائل بنفس الوزن */
.nosite{min-height:44px;background:none;border:0;padding:8px 0;font-size:.875rem;color:var(--ash);text-decoration:underline;text-underline-offset:4px;margin-block-start:4px}
.nosite:hover{color:var(--ink)}
.alts{display:none;margin-block-start:18px;animation:in .3s var(--ease)}
.alts.on{display:block}

/* الخطة */
.plan{border:1px solid var(--hair);margin-block-end:18px;background:var(--hair);display:grid;gap:1px}
.prow{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 15px;align-items:start;overflow:hidden}
.prow:last-child{border-block-end:0}
.av{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--hair);background:var(--wash);font-family:var(--f-display);font-size:1.1rem}
.prow b{font-family:var(--f-display);font-weight:400;font-size:1.02rem;display:block}
.prow p{margin:3px 0 5px;color:var(--ash);font-size:.84rem;line-height:1.55}
.rolepick{width:100%;border:0;background:var(--paper);text-align:start;color:inherit;cursor:pointer}
.rolepick:hover{background:var(--wash)}
.rolepick[aria-pressed="true"]{background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent)}
.rolepick[aria-pressed="true"] .av{border-color:var(--accent);background:var(--accent);color:#fff}
.rank{display:inline-block;margin-inline-start:8px;font-family:var(--f-body);font-size:.68rem;color:var(--accent);background:var(--accent-wash);padding:2px 7px;vertical-align:2px}
.fit{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-block-start:8px;color:var(--ash);font-size:.72rem}
.fit i{display:block;height:3px;background:var(--hair);overflow:hidden}
.fit i::after{content:"";display:block;height:100%;width:var(--fit);background:var(--accent);transform-origin:right;animation:grow .55s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
html[dir="ltr"] .fit i::after{transform-origin:left}
.choice{border:1px solid var(--accent-edge);background:var(--accent-wash);padding:14px 16px;margin-block-end:18px;animation:in .3s var(--ease)}
.choice b{display:block;font-family:var(--f-display);font-size:.78rem;font-weight:400;color:var(--accent);margin-block-end:4px}
.choice p{margin:0;color:var(--ink);font-size:.875rem;line-height:1.65}
.choice small{display:block;color:var(--ash);margin-block-start:6px;font-size:.75rem}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-block-end:22px}
.insight{border:1px solid var(--hair);padding:12px 14px;background:var(--paper)}
.insight b{display:block;color:var(--ash);font-family:var(--f-display);font-size:.75rem;font-weight:400;margin-block-end:5px}
.insight p{margin:0;font-size:.86rem;line-height:1.55}
.insight a{display:inline-block;margin-block-start:5px;color:var(--accent);font-size:.72rem}
.identity-note{border:1px solid var(--accent-edge);background:var(--accent-wash);padding:12px 14px;font-size:.83rem;margin-block-end:16px}
.note{font-size:.8rem;color:var(--ash);display:flex;align-items:center;gap:8px;margin-block-end:22px}
.step-error{margin:20px 0 0;padding:12px 16px;border:1px solid var(--error);border-radius:var(--radius-control);background:var(--error-wash);color:var(--error-ink);font-size:var(--type-label);line-height:var(--leading-note)}


/* النهاية */
.done{text-align:center;padding-block-start:10px}
.done .av{width:72px;height:72px;font-size:1.8rem;margin:0 auto 22px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.done h1{margin-block-end:8px}
.done .sub{margin-inline:auto}
.receipt{border:1px solid var(--hair);text-align:start;margin:26px 0;background:var(--paper)}
.receipt__h{padding:12px 16px;background:var(--wash);border-block-end:1px solid var(--hair);font-family:var(--f-display);font-size:.8rem;color:var(--ash)}
.receipt__row{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-block-end:1px solid var(--hair);font-size:.875rem}
.receipt__row:last-child{border-block-end:0}.receipt__row svg{color:var(--accent)}.receipt__row small{color:var(--ash);font-size:.75rem}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* الأزرار */
.bar{position:fixed;inset-block-end:0;inset-inline:0;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:18px 22px calc(20px + env(safe-area-inset-bottom))}
.bar__in{max-width:916px;margin:0 auto;display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:49px;padding:10px 22px;border:1px solid var(--ink);border-radius:var(--radius-control);background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:400;font-size:.94rem;transition:background .18s,border-color .18s,transform .18s}
.btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn .drop{color:var(--accent-lt);transform:scaleX(-1)}
.btn:hover .drop{color:var(--paper)}
.btn--ghost{background:none;color:var(--ash);border-color:transparent;padding-inline:12px}
.btn--ghost:hover:not(:disabled){color:var(--ink);background:none;border-color:transparent;transform:none}
.bar .sp{margin-inline-start:auto;font-size:.8rem;color:var(--ash)}
@media(max-width:600px){.top{padding-block:18px}.wrap{padding-block-start:48px}.bar__in{justify-content:space-between}.bar .sp{display:none}.btn--ghost{padding-inline:8px}.receipt__row{grid-template-columns:18px minmax(0,1fr);gap:8px}.receipt__row small{grid-column:2}.kb__h{flex-wrap:wrap}}
@media(max-width:380px){.wrap{padding-inline:20px}.bar{padding-inline:20px}h1{font-size:1.8rem}.btn{padding-inline:14px}.top__actions{gap:8px}.top .logo{width:92px}}

@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
html:not([data-session="ready"]) #onboardApp{display:none!important}
html[data-session="ready"] #sessionGate{display:none!important}
.session-gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink)}
.session-gate__inner{width:min(100%,360px)}
.session-gate__mark{display:block;width:32px;height:32px;margin-block-end:32px;background:var(--ink);-webkit-mask:url(../assets/icon.png) center/contain no-repeat;mask:url(../assets/icon.png) center/contain no-repeat}
.session-gate h1{font-size:var(--type-section);font-weight:450;margin:0 0 8px}
.session-gate p{margin:0;color:var(--ash);font-size:var(--type-body)}
.session-gate__actions{display:none;gap:12px;flex-wrap:wrap;margin-block-start:24px}
html[data-session="error"] .session-gate__actions{display:flex}
.session-gate__actions button,.session-gate__actions a{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1px solid var(--ink);border-radius:var(--radius-control);background:var(--ink);color:var(--paper);font-size:var(--type-label)}
.session-gate__actions a{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<div class="session-gate" id="sessionGate" role="status" aria-live="polite">
  <div class="session-gate__inner"><span class="session-gate__mark" aria-hidden="true"></span><h1 id="sessionTitle">نفتح مساحة عملك</h1><p id="sessionMessage">نتحقق من جلستك…</p><div class="session-gate__actions"><button type="button" id="sessionRetry">أعد المحاولة</button><a href="../auth.html" id="sessionLogin">تسجيل الدخول</a></div></div>
</div>
<div id="onboardApp">
<a class="skip" href="#main" data-en="Skip to content">تجاوز إلى المحتوى</a>

<header class="top"><span class="logo" role="img" aria-label="سيادة" data-en-aria-label="Siyadah"></span><div class="top__actions"><small id="stepLbl">1 من 2</small><div class="lang-switch" role="group" aria-label="اللغة" data-en-aria-label="Language"><button type="button" id="langAr" aria-pressed="true">عربي</button><button type="button" id="langEn" aria-pressed="false">EN</button></div><button class="top__logout" id="logoutBtn" type="button" data-en="Log out">خروج</button></div><p class="logout-status" id="logoutStatus" role="alert"></p></header>
<div class="prog"><i id="prog"></i></div>

<main class="wrap" id="main">

  <!-- 1 — موقعك -->
  <section class="step on" data-step="1">
    <div class="k"><span class="drop"></span><span data-en="Start">البداية</span></div>
    <h1 id="startTitle">ابدأ من موقع شركتك.</h1>
    <p class="sub" id="startSub">نستخرج ما يحتاجه موظفك الأول، مع مصدر كل معلومة.</p>
    <div class="field"><div id="siteEntry"><label for="site" data-en="Company website">رابط موقع الشركة</label><input class="in" id="site" type="url" dir="ltr" style="text-align:left" placeholder="ufuq.sa" autofocus>
      <div class="site" id="siteSt" role="status" aria-live="polite" style="display:none"><span class="drop"></span><div id="siteTx"></div></div>
      </div>
      <button class="nosite" id="noSite" type="button" aria-expanded="false" aria-controls="alts">ما عندي موقع</button>
      <div class="alts" id="alts">
        <div class="field"><label for="lines3" data-en="What do you offer?">ماذا تقدم؟</label>
          <textarea class="in" id="lines3" rows="3" placeholder="نوصّل طلبات المطاعم في الرياض وجدة. عملاؤنا مطاعم متوسطة. أكثر سؤال: كم عمولتكم وكم يوم التفعيل؟" data-en-placeholder="We deliver restaurant orders in Riyadh and Jeddah. Our customers are mid-sized restaurants."></textarea></div>
        <div class="field"><label for="co" data-en="Company name">اسم الشركة</label><input class="in" id="co" type="text" placeholder="شركة الأفق" data-en-placeholder="Your company"></div>
      </div>
    </div>
  </section>

  <!-- 2 — أولويتك -->
  <section class="step" data-step="2">
    <div class="k"><span class="drop"></span><span data-en="Your company">ملف شركتك</span></div>
    <h1 data-en="Your company, as we understand it.">هذه شركتك كما فهمناها.</h1>
    <p class="sub" data-en="Review what we found. Then choose your employee's first task.">راجع المعلومات، ثم اختر ما يبدأ به موظفك.</p>
    <div class="step__review">
    <div id="companyRead"></div>
    <div id="identityNote" class="identity-note" hidden></div>
    <div id="companyInsights" class="insights"></div>
    </div>
    <div class="step__employee">
    <div class="field"><label for="brief"><span data-en="What's the first task?">ما أول مهمة تريدها؟</span> <span class="optional" data-en="Optional">اختياري</span></label><input class="in" id="brief" type="text" maxlength="500" placeholder="مثلًا: متابعة العملاء المحتملين" data-en-placeholder="For example: Follow up with new leads."></div>
    <div class="k"><span class="drop"></span><span data-en="Your first employee">موظفك الأول</span></div>
    <div id="plan"></div>
    </div>
  </section>

  <p class="step-error" id="stepError" role="alert" hidden></p>
</main>

<footer class="bar"><div class="bar__in">
  <button type="button" class="btn btn--ghost" id="back" style="visibility:hidden" data-en="Back">رجوع</button>
  <span class="sp" id="sp"></span>
  <button type="button" class="btn" id="next">التالي <span class="drop"></span></button>
</div></footer>

<div class="live" id="live" aria-live="polite"></div>
</div>

<script>
(function(){
  var root=document.documentElement,title=document.getElementById('sessionTitle'),message=document.getElementById('sessionMessage'),retry=document.getElementById('sessionRetry'),login=document.getElementById('sessionLogin');
  var requested=new URLSearchParams(location.search).get('lang');
  var locale=requested==='en'||requested==='ar'?requested:(sessionStorage.getItem('siyadah_locale')==='en'?'en':'ar');
  if(locale==='en'){
    root.lang='en';root.dir='ltr';title.textContent='Opening your workspace';message.textContent='Checking your session…';retry.textContent='Try again';login.textContent='Sign in';
  }
  async function checkSession(){
    root.dataset.session='checking';
    message.textContent=locale==='en'?'Checking your session…':'نتحقق من جلستك…';
    retry.disabled=true;
    var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},12000);
    try{
      var response=await fetch('/siyadah-api/v1/auth/session',{credentials:'same-origin',signal:controller.signal});
      if(!response.ok)throw new Error(response.status===401?'expired':'unavailable');
      var session=typeof response.json==='function'?await response.json().catch(function(){return {}; }):{};window.__SIY_ACCOUNT_NAME__=session&&session.account&&session.account.companyName||'';
      root.dataset.session='ready';
      var script=document.createElement('script');script.src='onboard.js?v=1.9.0';document.body.appendChild(script);
    }catch(error){
      title.textContent=locale==='en'?'We could not open your workspace':'تعذّر فتح مساحة عملك';
      message.textContent=error.message==='expired'?(locale==='en'?'Your session has ended. Sign in to continue.':'انتهت جلستك. سجّل الدخول للمتابعة.'):(locale==='en'?'We could not verify your session. Try again.':'تعذّر التحقق من جلستك. أعد المحاولة.');
      root.dataset.session='error';retry.disabled=false;
    }finally{clearTimeout(timer);}
  }
  retry.addEventListener('click',checkSession);
  checkSession();
})();
</script>
</body>
</html>
