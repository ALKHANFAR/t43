<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر مطوري سيادة</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#101114;--muted:#686b73;--line:#dedfe4;--wash:#f6f7f8;--green:#087a46;--bad:#a03b32}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.7}main{width:min(1320px,calc(100% - 32px));margin:auto;padding:44px 0 80px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}h1{font-size:clamp(2rem,4vw,3.6rem);font-weight:450;line-height:1.15;margin:0}header p{margin:8px 0 0;color:var(--muted)}.safe{border:1px solid #b8dfca;color:var(--green);padding:8px 12px;font-size:.8rem}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.box{border:1px solid var(--line);padding:18px}label{display:block;font-weight:650;margin-bottom:7px}small{display:block;color:var(--muted);font-weight:400}textarea{width:100%;min-height:125px;resize:vertical;border:1px solid var(--line);background:var(--wash);padding:12px;font:inherit}button{font:inherit;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;align-items:center;gap:12px;margin:16px 0 26px}.status{color:var(--muted);font-size:.85rem}.context{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.context span{border:1px solid var(--line);background:var(--wash);padding:5px 9px;font-size:.75rem}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.card[data-win="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.card h2{font-size:.95rem;margin:0;padding:13px;border-bottom:1px solid var(--line)}.answer{white-space:pre-wrap;padding:15px;min-height:220px;overflow-wrap:anywhere;flex:1}.meta{border-top:1px solid var(--line);padding:9px 13px;color:var(--muted);font-size:.72rem}.pick{border:0;border-top:1px solid var(--line);background:var(--wash);color:var(--ink)}.pick[aria-pressed="true"]{background:var(--green);color:#fff}.export{display:none;margin-top:14px}.export.on{display:inline-block}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:50px;text-align:center;color:var(--muted)}.history{margin-top:40px;border-top:1px solid var(--line);padding-top:20px}.history-list{display:grid;gap:7px}.history-list button{text-align:right;background:#fff;color:var(--ink);border-color:var(--line)}@media(max-width:850px){header,.grid,.results{display:grid;grid-template-columns:1fr}.safe{width:max-content}}
</style>
</head>
<body><main>
<header><div><small>بيئة تطوير محلية فقط</small><h1>جرّب أولًا. غيّر لاحقًا.</h1><p>ثلاثة متغيرات، نفس لقطة البيانات، ولا اتصال بقاعدة سيادة أو أدوات العملاء.</p></div><div class="safe">معزول · بلا أثر خارجي</div></header>
<form id="form"><div class="grid"><div class="box"><label for="scenario">الحالة التي نختبرها<small>طلب حقيقي بصياغة المستخدم.</small></label><textarea id="scenario" required maxlength="5000"></textarea></div><div class="box"><label for="custom">تعليمات المتغير الثالث<small>المتغير الأول حر، والثاني بتوجيه سيادة، والثالث بهذه التعليمات.</small></label><textarea id="custom" required maxlength="4000"></textarea></div></div><div class="actions"><button id="run" type="submit">شغّل المقارنة</button><span class="status" id="status"></span></div></form>
<div class="context" id="context"></div><section class="results" id="results"><div class="empty">لم تبدأ تجربة بعد.</div></section><button class="export" id="export" type="button">جهّز طلب التغيير</button>
<section class="history"><h2>سجل هذا المتصفح</h2><div class="history-list" id="history"></div></section>
</main><script src="/app.js"></script></body></html>
