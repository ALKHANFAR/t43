<div class="detail-foot"><button class="text-link" style="background:none;border:0;padding:0" data-go="tools">${lang==='ar'?'افتح الأدوات ←':'Open tools →'}</button></div>`:`<div class="surface card" style="background:var(--wash)"><strong>${lang==='ar'?'لا نتائج تشغيل بعد':'No execution results yet'}</strong><p class="micro">${lang==='ar'?'يظهر الأثر بعد عمل حقيقي، مع مصدره ودليله.':'Impact appears after real work, with source and evidence.'}</p></div>`;el('view-employee').innerHTML=`<div class="screen-head"><div><p class="eyebrow">${lang==='ar'?'الموظف':'Employee'} / ${t().onboard.roles[selectedRole][0]}</p><h1 class="employee-name">${v.name}</h1><p class="employee-role">${v.role}</p></div><button class="button ghost small" id="employeeQuestion">${lang==='ar'?'اسأل '+v.name:'Ask '+v.name}</button></div><div class="employee-top"><div class="surface card"><span class="step-number">01 / ${lang==='ar'?'المهمة':'Assignment'}</span><h2 style="font:400 23px var(--f-display);margin:17px 0 8px">${v.task}</h2><p class="micro">${lang==='ar'?'يجهز العمل، ويعود لقرارك قبل أي فعل خارج الصلاحية.':'Prepares the work and asks before acting outside scope.'}</p></div><div class="employee-signal ${employeeWorking?'work':''}"><span class="status ${employeeWorking?'work':'draft'}"><i class="dot"></i>${employeeWorking?x.work:x.draft}</span><p class="micro">${employeeWorking?lang==='ar'?'إشارة توضيحية للحالة فقط.':'Illustrative state only.':x.signal}</p></div></div><div class="lenses">${x.lenses.map((l,i)=>`<button type="button" class="lens ${lens===i?'active':''}" data-lens="${i}" aria-pressed="${lens===i}"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><b>${l[2]} ${lang==='ar'?'←':'→'}</b></button>`).join('')}</div><div class="surface detail"><h3>${lens===0?x.journey:x.lenses[lens][0]}</h3>${detail}</div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="button ghost small" id="stateToggle">${employeeWorking?lang==='ar'?'أظهر المسودة':'Show draft':lang==='ar'?'عاين حالة العمل':'Preview working state'}</button></div>`;el('view-employee').querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{lens=+b.dataset.lens;renderEmployee()});el('view-employee').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));el('employeeQuestion').onclick=()=>show('workspace');el('stateToggle').onclick=()=>{employeeWorking=!employeeWorking;renderEmployee()}}
function renderTools(){let x=t().tools;el('view-tools').innerHTML=`<div class="screen-head"><div><p class="eyebrow">${x.k}</p><h1 class="title">${x.h}</h1><p class="subtitle">${x.sub}</p></div></div><div class="tool-list">${x.rows.map(r=>`<div class="tool-row"><div class="tool-icon">${r[0]}</div><div class="text"><strong>${r[1]}</strong><small>${r[2]}</small></div><button class="button ghost small tool-action" type="button">${r[3]}</button></div>`).join('')}</div><div class="scope"><strong>${x.scope}</strong><span>${x.scopeText}</span></div><p class="quiet-note">${lang==='ar'?'هذه معاينة واجهة. الربط الفعلي يتم في التطبيق بعد التحقق من صلاحية الحساب.':'Interface preview. Real connections happen in the app after permission checks.'}</p>`;el('view-tools').querySelectorAll('.tool-action').forEach(b=>b.onclick=()=>{b.textContent=lang==='ar'?'تظهر الصلاحيات هنا':'Permissions appear here';b.disabled=true})}
function renderResults(){let x=t().results;el('view-results').innerHTML=`<div class="screen-head"><div><p class="eyebrow">${x.k}</p><h1 class="title">${x.h}</h1><p class="subtitle">${x.sub}</p></div></div><div class="surface result-focus"><div class="row between"><span class="status work"><i class="dot"></i>${lang==='ar'?'جاهز للمراجعة':'Ready for review'}</span><span class="quiet-note">#182</span></div><div><h3>${x.result}</h3><p class="micro">${x.resultSub}</p></div></div><div class="surface evidence"><h3>${x.proof}</h3>${x.evidence.map(e=>`<div class="evidence-row"><span>${e[0]}</span><span>${e[1]}</span></div>`).join('')}</div><div class="permission-card"><h3>${x.permission}</h3><p>${x.permissionText}</p><button class="button small" type="button" id="reviewDraft">${x.approve}</button></div><p class="quiet-note">${lang==='ar'?'البيانات المعروضة توضيحية ولا تمثل مهمة منفّذة.':'Illustrative data; no task was executed.'}</p>`;el('reviewDraft').onclick=()=>{el('reviewDraft').textContent=lang==='ar'?'تفتح المسودة في المنتج الحقيقي':'Draft opens in the real product';el('reviewDraft').disabled=true}}
function renderSettings(){let x=t().settings;el('view-settings').innerHTML=`<div class="screen-head"><div><p class="eyebrow">${x.k}</p><h1 class="title">${x.h}</h1><p class="subtitle">${x.sub}</p></div></div>${x.groups.map((g,i)=>`<div class="settings-group"><div><h3>${g[0]}</h3><p>${g[1]}</p></div><div class="fields"><label class="label" for="setting-${i}-a">${g[2]}</label><input class="field" id="setting-${i}-a" placeholder="${g[2]}"><label class="label" for="setting-${i}-b">${g[3]}</label><input class="field" id="setting-${i}-b" placeholder="${g[3]}"></div></div>`).join('')}<div class="row" style="justify-content:flex-end"><button class="button blue" id="settingsSave">${lang==='ar'?'احفظ التغييرات':'Save changes'}</button></div><p class="quiet-note" id="settingsNote">${t().demo}</p>`;el('settingsSave').onclick=()=>el('settingsNote').textContent=lang==='ar'?'المعاينة لا تحفظ البيانات.':'The preview does not save data.'}
el('localeToggle').onclick=()=>{lang=lang==='ar'?'en':'ar';render()};let initial=location.hash.slice(1);if(ids.includes(initial))view=initial;render();
</script>
