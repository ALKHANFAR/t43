<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سيادة — معاينة التجربة</title><link rel="icon" href="../assets/icon.png"><link rel="stylesheet" href="siyadah-chat-experience-v2.css"></head>
<body>
<div class="preview-notice"><span>معاينة تفاعلية · بيانات توضيحية</span></div>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="مساحتك"><a class="brand" href="#chat"><img src="../assets/icon.png" alt="" width="34" height="24"><strong>سيادة</strong></a><button type="button" class="primary new-request" id="newRequest"><span data-icon="plus"></span>طلب جديد</button><nav aria-label="التنقل"><button type="button" data-view="chat" aria-current="page"><span data-icon="chat"></span>محادثاتك</button><button type="button" data-view="results"><span data-icon="result"></span>النتائج</button><button type="button" data-view="tools"><span data-icon="grid"></span>الأدوات</button></nav><div class="history-section"><p class="section-label">رجّعني إلى</p><div id="history"></div></div><div class="sidebar-footer"><span class="account-mark" data-icon="user"></span><span><b>حسابك</b><small>مساحة المعاينة</small></span><button type="button" class="icon-button" id="languageButton" aria-label="عرض المعاينة من اليسار إلى اليمين">LTR</button></div></aside>
<button type="button" class="scrim" id="scrim" aria-label="إغلاق القائمة" hidden></button>
<main class="main"><header class="header"><div class="header-title"><button type="button" class="icon-button menu-button" id="menuButton" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button><h1 id="pageTitle">محادثتك مع سيادة</h1></div><button type="button" class="text-button" id="backToChat" hidden><span data-icon="arrow"></span>العودة للمحادثة</button></header>
<div class="content-scroll" id="contentScroll"><section id="chatView" aria-label="المحادثة"><div class="welcome" id="welcome"><img src="../assets/icon.png" width="45" height="26" alt=""><h2>وش تحتاج ننجز؟</h2><p>اكتبها بطريقتك</p><div class="suggestions"><button type="button" data-example="رتّب طلبات العملاء وسجّل المتابعة">رتّب طلبات العملاء</button><button type="button" data-example="عندي طلب ناقص، رتّب المتابعة">رتّب طلبًا ناقصًا</button><button type="button" data-example="جهّز قائمة أولويات المتابعة">جهّز أولويات المتابعة</button></div></div><div id="conversation" hidden></div></section><section id="resultsView" hidden><div class="view-heading"><h2>نتائجك، في مكان واحد</h2></div><div id="resultArchive"></div></section><section id="toolsView" hidden><div class="view-heading"><h2>الأداة المناسبة لطلبك</h2><p>أضف الأدوات التي يحتاجها طلبك</p></div><label class="view-search"><span data-icon="search"></span><input id="catalogSearch" type="search" placeholder="ابحث باسم الأداة أو استخدامها" aria-label="البحث في الأدوات"></label><div id="catalog" class="catalog"></div></section></div>
<footer class="composer-region" id="composerRegion"><div id="suggestedTools" class="suggested-tools" hidden></div><div class="context-chips" id="contextChips" role="group" aria-label="أدوات هذا الطلب"></div><div class="composer"><textarea id="requestInput" rows="1" maxlength="2000" placeholder="وش تحتاج ننجز؟" aria-label="طلبك"></textarea><button type="button" class="tool-trigger" id="toolTrigger" aria-label="إضافة أداة لهذا الطلب" aria-haspopup="dialog" aria-expanded="false" aria-controls="toolPicker"><span data-icon="plus"></span></button><button type="button" class="primary send-button" id="sendButton" aria-label="عرض المثال" disabled><span data-icon="send"></span></button></div><p class="composer-caption" id="composerCaption">Enter للعرض · Shift + Enter لسطر جديد</p></footer>
</main></div>
<div class="tool-picker" id="toolPicker" role="dialog" aria-modal="false" aria-labelledby="pickerTitle" hidden><div class="picker-heading"><b id="pickerTitle">أضف أداة لهذا الطلب</b><button type="button" class="icon-button" id="closePicker" aria-label="إغلاق اختيار الأدوات"><span data-icon="close"></span></button></div><label class="picker-search"><span data-icon="search"></span><input id="pickerSearch" type="search" placeholder="ابحث عن أداة" aria-label="ابحث عن أداة"></label><div id="pickerList" class="picker-list"></div><p class="picker-note">لهذا الطلب فقط</p></div>
<div class="inspector-backdrop" id="inspector" hidden><section class="inspector" role="dialog" aria-modal="true" aria-labelledby="inspectorTitle"><header><h2 id="inspectorTitle">تفاصيل النتيجة</h2><button type="button" class="icon-button" id="closeInspector" aria-label="إغلاق التفاصيل"><span data-icon="close"></span></button></header><div id="inspectorContent"></div></section></div>
<div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
<script src="siyadah-chat-experience-v2.js"></script>
</body></html>
