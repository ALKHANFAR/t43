<!DOCTYPE html><html data-theme="siyadah" lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>سيادة — الدخول</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="siyadah-theme.css">
<link rel="stylesheet" href="auth-design.css"></head><body>
<a class="skip" id="skip" href="#authForm">تجاوز إلى النموذج</a>
<main class="auth-main"><div class="shell">
  <section class="story" aria-labelledby="storyTitle">
    <div class="story-top"><a id="storyHome" href="ar.html" aria-label="سيادة، الصفحة الرئيسية"><span class="siyadah-logo" role="img" aria-label="Siyadah AI"></span></a><span class="brand-icon" aria-hidden="true"></span></div>
    <div class="story-body"><p class="story-kicker" id="storyKicker">سيادة للأعمال</p><h2 id="storyTitle">طلب. خطة. دليل.</h2>
      <div class="story-example"><div class="example-top"><span id="exampleTag">مثال توضيحي</span><span id="exampleIndex" dir="ltr" aria-hidden="true">01 / 03</span></div><div class="example-scene" aria-live="polite"><p id="exampleRequest">«رتّب متابعة العملاء هذا الأسبوع»</p><p id="exampleDetail">طلبك يحدد البداية.</p></div><div class="story-steps" id="storySteps" role="group" aria-label="مراحل المثال"><button type="button" data-story-step="0" aria-pressed="true"><b>01</b><span id="step1">الطلب</span></button><button type="button" data-story-step="1" aria-pressed="false"><b>02</b><span id="step2">الخطة</span></button><button type="button" data-story-step="2" aria-pressed="false"><b>03</b><span id="step3">الدليل</span></button></div></div>
    </div>
  </section>
  <section class="card" aria-labelledby="ttl">
    <div class="card-top"><a class="mobile-logo" id="mobileHome" href="ar.html" aria-label="سيادة، الصفحة الرئيسية"><span class="siyadah-logo" role="img" aria-label="Siyadah AI"></span></a><div class="languages" role="group" aria-label="اللغة"><button type="button" id="langAr" aria-pressed="true" lang="ar">عربي</button><button type="button" id="langEn" aria-pressed="false" lang="en">EN</button></div></div>
    <div class="card-body"><h1 id="ttl">تسجيل الدخول</h1><p class="sub hide" id="sub"></p>
      <form id="authForm" novalidate>
        <div class="field hide" id="coRow"><label id="companyLabel" for="company">اسم الشركة</label><div class="ip"><input id="company" name="company" type="text" autocomplete="organization" maxlength="120" placeholder="اسم شركتك" aria-describedby="companyError"></div><p class="field-error" id="companyError"></p></div>
        <div class="field" id="emailRow"><label id="emailLabel" for="email">البريد الإلكتروني</label><div class="ip"><input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@company.com" aria-describedby="emailError"></div><p class="field-error" id="emailError"></p></div>
        <div class="field" id="passwordRow"><label id="passwordLabel" for="password">كلمة المرور</label><div class="ip"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="كلمة المرور" aria-describedby="passwordError"><button id="showPassword" class="show-password" type="button" aria-pressed="false">إظهار</button></div><progress class="password-progress hide" id="passwordProgress" max="10" value="0" aria-label="التقدم نحو الحد الأدنى لكلمة المرور"></progress><p class="field-error" id="passwordError"></p></div>
        <a class="forgot" id="forgot" href="#">نسيت كلمة المرور؟</a>
        <button class="btn" id="go" type="submit">دخول</button>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </form>
      <div class="toggle" id="tg">ما عندك حساب؟ <button id="sw" type="button">أنشئ حسابًا</button></div>
    </div>
  </section>
</div></main>
<script>
var API=window.SIYADAH_AUTH_BASE||"/siyadah-api";
var params=new URLSearchParams(location.search),resetToken=params.get("reset")||"",verifyToken=params.get("verify")||"";
var mode=verifyToken?"verify":(resetToken?"reset":"login");
var locale=params.get("lang")==="en"?"en":(params.get("lang")==="ar"?"ar":(sessionStorage.getItem("siyadah_locale")==="en"?"en":"ar"));
var $=function(id){return document.getElementById(id)};
var i18n={
 ar:{title:"سيادة — الدخول",skip:"تجاوز إلى النموذج",home:"سيادة، الصفحة الرئيسية",kicker:"سيادة للأعمال",storyTitle:"طلب. خطة. دليل.",exampleTag:"مثال توضيحي",steps:["الطلب","الخطة","الدليل"],language:"اللغة",company:"اسم الشركة",email:"البريد الإلكتروني",password:"كلمة المرور",companyPlaceholder:"اسم شركتك",passwordPlaceholder:"كلمة المرور",newPasswordPlaceholder:"10 أحرف على الأقل",forgot:"نسيت كلمة المرور؟",show:"إظهار",hide:"إخفاء",loginPrompt:"ما عندك حساب؟",signupLink:"أنشئ حسابًا",returnLogin:"العودة لتسجيل الدخول",busy:"جارٍ الإرسال…",verifyBusy:"جارٍ تأكيد البريد…",verifyRetry:"أعد المحاولة",verifyFailed:"تعذّر تأكيد البريد. أعد المحاولة.",required:"أكمل هذا الحقل.",badEmail:"أدخل بريدًا إلكترونيًا صحيحًا.",shortPassword:"استخدم 10 أحرف على الأقل.",connection:"تعذر الاتصال. حاول مرة أخرى.",generic:"تعذر إكمال الطلب. حاول مرة أخرى.",verified:"تم تأكيد بريدك. سجّل الدخول للمتابعة.",resetDone:"تم التغيير. سجّل دخولك بكلمة المرور الجديدة.",signupDone:"أرسلنا رابط تأكيد إلى بريدك. افتحه لإكمال التسجيل.",forgotDone:"إذا كان البريد مسجلًا فسيصلك رابط الاستعادة.",modes:{login:["تسجيل الدخول","","دخول"],signup:["إنشاء حساب","","إنشاء حساب"],forgot:["استعادة كلمة المرور","سنرسل رابط الاستعادة إلى بريدك.","إرسال الرابط"],reset:["كلمة مرور جديدة","سيُنهي التغيير جلساتك السابقة لحماية حسابك.","حفظ كلمة المرور"],verify:["تأكيد البريد","نتحقق من رابط التأكيد الآن…",""]}},
 en:{title:"Siyadah — Sign in",skip:"Skip to form",home:"Siyadah, home",kicker:"Siyadah for business",storyTitle:"Request. Plan. Proof.",exampleTag:"Illustrative example",steps:["Request","Plan","Proof"],language:"Language",company:"Company name",email:"Email address",password:"Password",companyPlaceholder:"Your company",passwordPlaceholder:"Password",newPasswordPlaceholder:"At least 10 characters",forgot:"Forgot password?",show:"Show",hide:"Hide",loginPrompt:"New to Siyadah?",signupLink:"Create an account",returnLogin:"Back to sign in",busy:"Sending…",verifyBusy:"Verifying your email…",verifyRetry:"Try again",verifyFailed:"We couldn't confirm your email. Try again.",required:"Complete this field.",badEmail:"Enter a valid email address.",shortPassword:"Use at least 10 characters.",connection:"Connection failed. Try again.",generic:"We couldn't complete this request. Try again.",verified:"Email confirmed. Sign in to continue.",resetDone:"Password updated. Sign in with your new password.",signupDone:"We sent a confirmation link to your email. Open it to finish signing up.",forgotDone:"If this email is registered, you'll receive a reset link.",modes:{login:["Sign in","","Sign in"],signup:["Create an account","","Create account"],forgot:["Reset your password","We'll email you a password reset link.","Send reset link"],reset:["New password","Changing it will end your previous sessions.","Save password"],verify:["Confirm your email","We're checking your confirmation link…",""]}}
};
var storyStep=0;
var storyScenes={
 ar:[
  ["«رتّب متابعة العملاء هذا الأسبوع»",""],
  ["خطة العمل","الخطوات والأدوات وحدودها."],
  ["نتيجة قابلة للتحقق","الفعل، وقته، ومصدره."]
 ],
 en:[
  ["“Organize customer follow-ups this week”",""],
  ["A plan of action","Steps, tools, and limits."],
  ["A verifiable outcome","The action, time, and source."]
 ]
};
function renderStory(){
 var scene=storyScenes[locale][storyStep];$("exampleRequest").textContent=scene[0];$("exampleDetail").textContent=scene[1];$("exampleDetail").classList.toggle("hide",!scene[1]);$("exampleIndex").textContent="0"+(storyStep+1)+" / 03";
 document.querySelectorAll("[data-story-step]").forEach(function(button){button.setAttribute("aria-pressed",String(Number(button.getAttribute("data-story-step"))===storyStep));});
}
function updatePasswordProgress(){
 var meter=$("passwordProgress"),count=Math.min($("password").value.length,10);
 meter.value=count;
 meter.classList.toggle("complete",count===10);
}
function clearErrors(){["company","email","password"].forEach(function(id){$(id+"Error").textContent="";$(id).removeAttribute("aria-invalid")})}
function clearMessage(){var e=$("msg");e.className="msg";e.textContent="";e.setAttribute("role","status")}
function show(type,message){var e=$("msg");e.className="msg "+type;e.textContent=message;e.setAttribute("role",type==="err"?"alert":"status")}
function applyCopy(){
 var t=i18n[locale],copy=t.modes[mode],home=locale==="ar"?"ar.html":"index.html";
 document.documentElement.lang=locale;document.documentElement.dir=locale==="ar"?"rtl":"ltr";document.title=t.title;
 $("skip").textContent=t.skip;$("storyHome").href=home;$("mobileHome").href=home;
 $("storyHome").setAttribute("aria-label",t.home);$("mobileHome").setAttribute("aria-label",t.home);
 $("storyKicker").textContent=t.kicker;$("storyTitle").textContent=t.storyTitle;$("exampleTag").textContent=t.exampleTag;
 t.steps.forEach(function(step,index){$("step"+(index+1)).textContent=step});$("storySteps").setAttribute("aria-label",locale==="ar"?"مراحل المثال":"Example stages");renderStory();
 $("ttl").textContent=copy[0];$("sub").textContent=copy[1];$("sub").classList.toggle("hide",!copy[1]);$("go").textContent=copy[2];
 $("companyLabel").textContent=t.company;$("emailLabel").textContent=t.email;$("passwordLabel").textContent=t.password;$("company").placeholder=t.companyPlaceholder;$("password").placeholder=mode==="signup"||mode==="reset"?t.newPasswordPlaceholder:t.passwordPlaceholder;
 $("forgot").textContent=t.forgot;$("showPassword").textContent=$("password").type==="password"?t.show:t.hide;
 $("langAr").setAttribute("aria-pressed",String(locale==="ar"));$("langEn").setAttribute("aria-pressed",String(locale==="en"));$("langAr").parentNode.setAttribute("aria-label",t.language);
 $("coRow").className=mode==="signup"?"field":"field hide";
 $("emailRow").className=(mode==="reset"||mode==="verify")?"field hide":"field";
 $("passwordRow").className=(mode==="forgot"||mode==="verify")?"field hide":"field";
 $("forgot").className=mode==="login"?"forgot":"forgot hide";
 $("go").className="btn";if(mode==="verify")$("go").textContent=t.verifyRetry;
 $("password").setAttribute("autocomplete",mode==="login"?"current-password":"new-password");
 $("passwordProgress").classList.toggle("hide",mode!=="signup"&&mode!=="reset");$("passwordProgress").setAttribute("aria-label",locale==="ar"?"التقدم نحو الحد الأدنى لكلمة المرور":"Progress toward minimum password length");updatePasswordProgress();
 $("tg").className=mode==="verify"?"toggle hide":"toggle";
 $("tg").innerHTML=mode==="login"?t.loginPrompt+' <button id="sw" type="button">'+t.signupLink+'</button>':'<button id="sw" type="button">'+t.returnLogin+'</button>';
 $("sw").onclick=function(){setMode(mode==="login"?"signup":"login")};
}
function setMode(next){mode=next;clearErrors();clearMessage();applyCopy()}
function setLanguage(next){locale=next;sessionStorage.setItem("siyadah_locale",locale);clearErrors();clearMessage();applyCopy()}
function fieldError(id,message){$(id+"Error").textContent=message;$(id).setAttribute("aria-invalid","true");return $(id)}
function validate(){
 var t=i18n[locale],first=null,email=$("email").value.trim(),password=$("password").value,company=$("company").value.trim();clearErrors();
 function mark(id,message){var input=fieldError(id,message);if(!first)first=input}
 if(mode==="signup"&&!company)mark("company",t.required);
 if(mode!=="reset"&&!email)mark("email",t.required);
 else if(mode!=="reset"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))mark("email",t.badEmail);
 if(mode!=="forgot"&&!password)mark("password",t.required);
 else if((mode==="signup"||mode==="reset")&&password.length<10)mark("password",t.shortPassword);
 if(first){first.focus();return false}return true;
}
function nextAfterLogin(data){return data.onboardingRequired?"app/onboard.html":"app/chat.html";}
$("langAr").onclick=function(){setLanguage("ar")};$("langEn").onclick=function(){setLanguage("en")};
document.querySelectorAll("[data-story-step]").forEach(function(button){button.addEventListener("click",function(){storyStep=Number(button.getAttribute("data-story-step"));renderStory();});});
$("forgot").onclick=function(event){event.preventDefault();setMode("forgot")};
$("showPassword").onclick=function(){var input=$("password"),revealed=input.type==="password";input.type=revealed?"text":"password";this.setAttribute("aria-pressed",String(revealed));this.textContent=revealed?i18n[locale].hide:i18n[locale].show;input.focus()};
$("password").addEventListener("input",updatePasswordProgress);
$("authForm").onsubmit=function(event){
  event.preventDefault();if(mode==="verify"){if(!$("go").disabled)confirmEmail();return;}if($("go").disabled||!validate())return;
  var email=$("email").value.trim(),pw=$("password").value,co=$("company").value.trim();
  var action=mode,t=i18n[locale];clearMessage();$("go").disabled=true;$("go").textContent=t.busy;
  var routes={login:"/v1/auth/login",signup:"/v1/auth/signup",forgot:"/v1/auth/forgot-password",reset:"/v1/auth/reset-password"};
  var bodies={login:{email:email,password:pw},signup:{email:email,password:pw,company_name:co,locale:locale},forgot:{email:email,locale:locale},reset:{token:resetToken,password:pw}};
  fetch(API+routes[action],{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(bodies[action])})
  .then(function(r){return r.json()}).then(function(d){
    $("go").disabled=false;applyCopy();
    if(d&&(d.ok===true||d.ok==="true")){
      show("ok",locale==="en"?({login:"Welcome back.",signup:t.signupDone,forgot:t.forgotDone,reset:t.resetDone})[action]:(d.message||"تم"));
      if(action==="login")setTimeout(function(){location.href=nextAfterLogin(d);},600);
      if(action==="reset")setTimeout(function(){history.replaceState({},"",location.pathname);resetToken="";setMode("login");show("ok",i18n[locale].resetDone);},700);
    }else{
      var englishErrors={invalid_login:"Incorrect email or password.",email_not_verified:"Confirm your email before signing in.",login_rate_limited:"Too many attempts. Try again in 15 minutes.",invalid_credentials:"Check your company name, email, and password.",invalid_password:"Use a password with at least 10 characters.",email_exists:"This email is already registered.",email_not_configured:"Email delivery is unavailable right now.",invalid_reset:"This reset link is invalid or expired."};
      show("err",locale==="en"?(englishErrors[d&&d.error]||t.generic):((d&&d.message)||t.generic));
    }
  }).catch(function(){$("go").disabled=false;applyCopy();show("err",i18n[locale].connection);});
};
function confirmEmail(){
  var button=$("go");button.disabled=true;button.textContent=i18n[locale].verifyBusy;show("ok",i18n[locale].verifyBusy);
  fetch(API+"/v1/auth/verify-email",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:verifyToken})})
  .then(function(r){return r.json()}).then(function(d){if(d&&d.ok){history.replaceState({},"",location.pathname);verifyToken="";setMode("login");show("ok",i18n[locale].verified);}else{show("err",i18n[locale].verifyFailed);}})
  .catch(function(){show("err",i18n[locale].connection);})
  .finally(function(){button.disabled=false;if(mode==="verify")button.textContent=i18n[locale].verifyRetry;});
}
applyCopy();
if(verifyToken)confirmEmail();
</script></body></html>
