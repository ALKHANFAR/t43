<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>سيادة — الدخول</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#FFFFFF; --wash:#F7F7FB; --ink:#0A0A0A; --ash:#6E6E6C; --hair:#E0E1E8;
  --accent:#0B844B; --accent-lt:#40E799; --accent-wash:#F2FAF6; --ok:#12784F;
  --f-display:"Readex Pro", system-ui, sans-serif; --f-body:"IBM Plex Sans Arabic", system-ui, sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 20px}
.card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--hair);border-radius:22px;box-shadow:0 1px 2px rgba(10,10,10,.04),0 18px 50px -28px rgba(10,10,10,.22);padding:40px 34px 34px}
/* الشعار */
.mark{display:flex;flex-direction:column;align-items:center;gap:12px;margin-block-end:26px}
.emblem{width:46px;height:46px;border-radius:14px;background:var(--ink);color:var(--accent-lt);display:grid;place-items:center;box-shadow:0 8px 22px -10px rgba(11,132,75,.55)}
.emblem svg{width:24px;height:24px}
.wordmark{font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.01em;line-height:1}
.wordmark small{display:block;font-size:.62rem;letter-spacing:.22em;color:var(--ash);margin-block-start:5px;text-align:center}
.eyebrow{font-family:var(--f-display);font-size:.72rem;letter-spacing:.06em;color:var(--accent);text-align:center;margin:0}
h1{font-family:var(--f-display);font-weight:600;font-size:1.55rem;line-height:1.3;text-align:center;margin:.35em 0 .15em}
.sub{color:var(--ash);text-align:center;font-size:.94rem;margin-block-end:28px}
.field{margin-block-end:16px}
.field label{display:block;font-family:var(--f-display);font-size:.8rem;color:var(--ash);margin-block-end:8px}
.ip{position:relative}
.ip svg{position:absolute;inset-block-start:50%;inset-inline-start:14px;transform:translateY(-50%);width:17px;height:17px;color:var(--ash);pointer-events:none;transition:color .2s var(--ease)}
.field input{width:100%;padding:13px 15px;padding-inline-start:42px;border:1px solid var(--hair);border-radius:12px;background:var(--paper);font:inherit;color:inherit;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.field input:focus ~ svg{color:var(--accent)}
.btn{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:14px 26px;margin-block-start:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:.98rem;font-weight:500;border-radius:12px;cursor:pointer;transition:all .25s var(--ease)}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.toggle{text-align:center;margin-block-start:20px;font-size:.92rem;color:var(--ash)}
.toggle a{color:var(--accent);cursor:pointer;font-weight:500}
.forgot{display:block;text-align:left;margin-top:-7px;color:var(--accent);font-size:.84rem;cursor:pointer}
.msg{margin-block-start:16px;padding:11px 14px;border-radius:10px;font-size:.9rem;display:none}
.msg.err{background:#FCEEEE;color:#B42318;display:block}
.msg.ok{background:var(--accent-wash);color:var(--ok);display:block}
.hide{display:none}
.orbar{display:flex;align-items:center;gap:12px;color:var(--ash);font-size:.8rem;font-family:var(--f-display);margin:22px 0 16px}
.orbar::before,.orbar::after{content:"";flex:1;height:1px;background:var(--hair)}
#gbtn{display:flex;justify-content:center}
/* شريط الأدوات كإثبات */
.trust{width:100%;max-width:420px;text-align:center}
.trust p{font-family:var(--f-display);font-size:.72rem;letter-spacing:.04em;color:var(--ash);margin:0 0 12px}
.logos{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.logos img{width:24px;height:24px;object-fit:contain;filter:grayscale(1);opacity:.6;transition:filter .25s var(--ease),opacity .25s var(--ease)}
.logos img:hover{filter:none;opacity:1}
.foot{font-size:.8rem;color:var(--ash);text-align:center}
.foot a{color:var(--ash)}
</style></head><body><main>
<div class="card">
  <div class="mark">
    <span class="emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <span class="wordmark">سيادة<small>SIYADAH AI</small></span>
  </div>
  <p class="eyebrow" id="eyebrow">بيتا خاصة — 500 شركة فقط</p>
  <h1 id="ttl">تسجيل الدخول</h1>
  <p class="sub" id="sub">ادخل لحسابك، وشوف فريقك يشتغل.</p>
  <div class="field hide" id="coRow"><label>اسم الشركة</label><div class="ip"><input id="company" type="text" placeholder="شركتك"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M10 9h.01M14 9h.01M10 13h.01M14 13h.01M10 17h4"/></svg></div></div>
  <div class="field" id="emailRow"><label>البريد الإلكتروني</label><div class="ip"><input id="email" type="email" placeholder="you@company.com" autocomplete="email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div></div>
  <div class="field" id="passwordRow"><label>كلمة المرور</label><div class="ip"><input id="password" type="password" placeholder="10 أحرف على الأقل" autocomplete="current-password" minlength="10"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></div></div>
  <a class="forgot" id="forgot">نسيت كلمة المرور؟</a>
  <button class="btn" id="go" type="button">دخول</button>
  <div id="msg" class="msg"></div>
  <div id="gwrap" hidden><div class="orbar">أو المتابعة عبر</div><div id="gbtn"></div></div>
  <div class="toggle" id="tg">ما عندك حساب؟ <a id="sw">أنشئ حسابًا</a></div>
</div>
<div class="trust">
  <p>يعمل داخل أدواتك التي تستخدمها أصلًا</p>
  <div class="logos">
    <img src="https://cdn.activepieces.com/pieces/whatsapp.png" alt="WhatsApp" crossorigin="anonymous" referrerpolicy="no-referrer">
    <img src="https://cdn.activepieces.com/pieces/gmail.png" alt="Gmail" crossorigin="anonymous" referrerpolicy="no-referrer">
    <img src="https://cdn.activepieces.com/pieces/google-sheets.png" alt="Google Sheets" crossorigin="anonymous" referrerpolicy="no-referrer">
    <img src="https://cdn.activepieces.com/pieces/hubspot.png" alt="HubSpot" crossorigin="anonymous" referrerpolicy="no-referrer">
    <img src="https://cdn.activepieces.com/pieces/slack.png" alt="Slack" crossorigin="anonymous" referrerpolicy="no-referrer">
    <img src="https://cdn.activepieces.com/pieces/stripe.png" alt="Stripe" crossorigin="anonymous" referrerpolicy="no-referrer">
  </div>
</div>
<p class="foot"><a href="ar.html">← رجوع للصفحة الرئيسية</a></p></main>
<script>
var API=window.SIYADAH_AUTH_BASE||"/siyadah-api";
var params=new URLSearchParams(location.search),resetToken=params.get("reset")||"",verifyToken=params.get("verify")||"";
var mode=verifyToken?"verify":(resetToken?"reset":"login");
var $=function(id){return document.getElementById(id)};
function setMode(m){mode=m;
  var copy={login:["تسجيل الدخول","ادخل لحسابك، وشوف فريقك يشتغل.","دخول"],signup:["إنشاء حساب جديد","دقيقة واحدة — ونبدأ نبني فريقك.","إنشاء حساب"],forgot:["استعادة كلمة المرور","سنرسل رابطًا صالحًا لمدة 30 دقيقة.","أرسل رابط الاستعادة"],reset:["كلمة مرور جديدة","سيُنهي التغيير الجلسات السابقة لحماية حسابك.","حفظ كلمة المرور"],verify:["تأكيد البريد","نتحقق من رابطك الآن…",""]}[m];
  $("ttl").textContent=copy[0];$("sub").textContent=copy[1];$("go").textContent=copy[2];
  $("coRow").className=m==="signup"?"field":"field hide";
  $("emailRow").className=(m==="reset"||m==="verify")?"field hide":"field";
  $("passwordRow").className=(m==="forgot"||m==="verify")?"field hide":"field";
  $("forgot").className=m==="login"?"forgot":"forgot hide";
  $("go").className=m==="verify"?"btn hide":"btn";
  $("password").setAttribute("autocomplete",m==="login"?"current-password":"new-password");
  $("tg").className=m==="verify"?"toggle hide":"toggle";
  $("tg").innerHTML=m==="login"?'ما عندك حساب؟ <a id="sw">أنشئ حسابًا</a>':'<a id="sw">العودة لتسجيل الدخول</a>';
  $("sw").onclick=function(){setMode(m==="login"?"signup":"login");$("msg").className="msg";};
}
$("forgot").onclick=function(){setMode("forgot");$("msg").className="msg";};
$("go").onclick=function(){
  var email=$("email").value.trim(),pw=$("password").value,co=$("company").value.trim();
  if((mode!=="reset"&&!email)||(mode!=="forgot"&&!pw)){show("err","أكمل البيانات المطلوبة");return;}
  var action=mode;
  $("go").disabled=true;$("go").textContent="لحظة…";
  var routes={login:"/v1/auth/login",signup:"/v1/auth/signup",forgot:"/v1/auth/forgot-password",reset:"/v1/auth/reset-password"};
  var locale=document.documentElement.lang||navigator.language||"ar";
  var bodies={login:{email:email,password:pw},signup:{email:email,password:pw,company_name:co,locale:locale},forgot:{email:email,locale:locale},reset:{token:resetToken,password:pw}};
  fetch(API+routes[action],{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(bodies[action])})
  .then(function(r){return r.json()}).then(function(d){
    $("go").disabled=false;setMode(action);
    if(d&&(d.ok===true||d.ok==="true")){
      show("ok",d.message||"تم");
      if(action==="login")setTimeout(function(){location.href="app/chat.html";},600);
      if(action==="reset")setTimeout(function(){history.replaceState({},"",location.pathname);resetToken="";setMode("login");show("ok","تم التغيير. سجّل دخولك بكلمة المرور الجديدة.");},700);
    }else show("err",(d&&d.message)||"تعذّر — تأكد من بياناتك");
  }).catch(function(){$("go").disabled=false;setMode(action);show("err","خطأ اتصال، حاول مرة ثانية");});
};
function show(t,m){var e=$("msg");e.className="msg "+t;e.textContent=m;}
function confirmEmail(){
  fetch(API+"/v1/auth/verify-email",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:verifyToken})})
  .then(function(r){return r.json()}).then(function(d){history.replaceState({},"",location.pathname);verifyToken="";setMode("login");show(d&&d.ok?"ok":"err",(d&&d.message)||"تعذّر تأكيد البريد.");})
  .catch(function(){history.replaceState({},"",location.pathname);verifyToken="";setMode("login");show("err","خطأ اتصال، افتح الرابط مرة ثانية.");});
}
$("password").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click();});
setMode(mode);
if(verifyToken)confirmEmail();
</script></body></html>
